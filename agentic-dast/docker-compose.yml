# =============================================================
# Agentic DAST — Ambiente Docker
# Dois containers:
#   1. juice-shop  → alvo da análise (Angular SPA)
#   2. zap         → proxy/scanner OWASP ZAP
# (o agente Node.js roda local, não em container)
# =============================================================

services:

  # -------------------------------------------------------
  # Alvo: OWASP Juice Shop
  # Acesso: http://localhost:3000
  # -------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - dast-net

  # -------------------------------------------------------
  # Scanner: OWASP ZAP (modo daemon)
  # No modo daemon o ZAP atende API REST e proxy HTTP na
  # mesma porta definida por -host/-port.
  # Endpoint unico: http://localhost:8080
  # -------------------------------------------------------
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY:-zapkey123}
    ports:
      - "8080:8080"   # API REST + Proxy HTTP (mesmo listener)
    networks:
      - dast-net

networks:
  dast-net:
    driver: bridge
